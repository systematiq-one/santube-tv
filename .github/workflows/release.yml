name: Release

# Push a version tag to publish a SanTube TV release:
#   git tag v0.2.0 && git push origin v0.2.0
# Or run it by hand from the Actions tab to get a draft build.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v), e.g. 0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out with submodules
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # MediaServiceCore and SharedModules carry the YouTube API layer;
          # the build fails without them
          submodules: recursive
          fetch-depth: 0

      - name: Apply the submodule patches
        run: sh patches/apply.sh

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ github.event.inputs.version }}"
          else
            NAME="${GITHUB_REF_NAME#v}"
          fi

          # The versionCode must never go down or Android refuses to update. Derive it from
          # the version itself rather than the run number, which resets if the workflow is
          # renamed and says nothing about ordering: 0.3.1 -> 3001, 1.2.10 -> 1002010.
          # Leaves room for hand-built test APKs numbered between two releases.
          CORE="${NAME%%-*}"

          if ! echo "$CORE" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::Version '$NAME' is not major[.minor[.patch]], e.g. 0.4.0"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          if [ "$MINOR" -gt 999 ] || [ "$PATCH" -gt 999 ]; then
            echo "::error::minor and patch must stay below 1000 (got $CORE)"
            exit 1
          fi

          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $NAME (versionCode $CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      # The build pins exact versions; runners carry different ones preinstalled.
      # The NDK is only used to strip debug symbols from bundled .so files, but
      # without it the APKs come out noticeably larger.
      - name: Install the pinned SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;30.0.3" "ndk;21.0.6113669"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing: add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # build.gradle reads this file; it never reaches the repo
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Only the SanTube variant is named here: a task of upstream's 'ststable' or 'stbeta'
      # variants in the same run switches the Google services plugin on, which then fails
      # for an application id it has no client for.
      - name: Build signed APKs
        run: |
          chmod +x ./gradlew
          ./gradlew :smarttubetv:assembleStsantubeRelease --no-daemon \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Check the APKs really are signed
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in smarttubetv/build/outputs/apk/stsantube/release/*.apk; do
            echo "== $apk"
            "$BT/apksigner" verify --print-certs "$apk" | head -3
          done

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.keystore"

      # "What's new" comes from the F-Droid style changelog of this versionCode, when there is one:
      # fastlane/metadata/android/en-US/changelogs/<versionCode>.txt (0.1.0 -> 1000.txt).
      - name: Write the release notes
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/$CODE.txt"
          NOTES="$RUNNER_TEMP/release-notes.md"
          : > "$NOTES"

          if [ -f "$CHANGELOG" ]; then
            printf '## What'"'"'s new\n\n' >> "$NOTES"
            cat "$CHANGELOG" >> "$NOTES"
            printf '\n\n' >> "$NOTES"
          else
            echo "::warning::No $CHANGELOG, the release has no 'What's new' section"
          fi

          cat <<'EOF' | sed "s/@NAME@/$NAME/g" >> "$NOTES"
          ## Install

          Download **`SanTube_tv_@NAME@_universal.apk`**: it works on every Android TV, Google TV
          and Fire TV device. The smaller files are for a known processor type: `armeabi-v7a`
          for most TVs and sticks, `arm64-v8a` for 64-bit boxes.

          Open the file on the TV (a file manager or the Downloader app) and allow installing
          from unknown sources when asked. Requires Android 4.2 or newer.

          > Updating from an earlier build signed with a different key? Uninstall the old app
          > first: Android blocks updates when the signature changes.
          EOF

      - name: Publish the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.name) || github.ref_name }}
          name: SanTube TV ${{ steps.version.outputs.name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: smarttubetv/build/outputs/apk/stsantube/release/*.apk
          body_path: ${{ runner.temp }}/release-notes.md

      - name: Upload APKs as build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apks
          path: smarttubetv/build/outputs/apk/stsantube/release/*.apk
          retention-days: 14
